<li class="info-card col-span-full" hx-get="/thermal" hx-trigger="intersect delay:5s" hx-swap="outerHTML">
    {% if thermal_info %}
    <div
        style="display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.75rem; width: 100%;">
        {% for sensor in thermal_info %}
        <div
            style="display: flex; gap: 0.75rem; align-items: center; background: rgba(255,255,255,0.05); padding: 0.5rem; border-radius: var(--radius-sm);">
            <div class="icon-box" style="width: auto; height: auto; padding: 0.25rem;">
                <span class="material-symbols-outlined" style="font-size: 1.5rem;">thermometer</span>
            </div>
            <div class="info-details">
                <strong>{{ sensor.label[:15] }}</strong>
                <span class="{{ 'text-danger' if sensor.critical and sensor.current >= sensor.critical else '' }}">
                    {{ sensor.current }}°C
                </span>
            </div>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <div style="padding: 1rem; text-align: center; color: rgba(255,255,255,0.5); width: 100%;">
        No thermal sensors detected
    </div>
    {% endif %}
</li>

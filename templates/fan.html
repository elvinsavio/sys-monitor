<li class="info-card col-span-full" hx-get="/fan" hx-trigger="intersect delay:5s" hx-swap="outerHTML">
    {% if fan_info %}
    {% for fan in fan_info %}
    <div style="display: flex; gap: 1rem; align-items: center; width: 100%;">
        <div class="icon-box" style="width: auto; height: auto; padding: 0.5rem;">
            <span id="fan-icon-{{ loop.index }}" hx-preserve="true"
                class="material-symbols-outlined spin-slow big-fan-icon">mode_fan</span>
        </div>
        <div class="info-details">
            <strong>{{ fan.label }}</strong>
            <span style="font-size: var(--text-lg); font-weight: 500;">{{ fan.rpm }} RPM</span>
        </div>
    </div>
    {% endfor %}
    {% else %}
    <div style="padding: 1rem; text-align: center; color: rgba(255,255,255,0.5);">
        No fans detected
    </div>
    {% endif %}
</li>

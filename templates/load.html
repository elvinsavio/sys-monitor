<li class="info-card col-span-full" hx-get="/load" hx-trigger="intersect delay:2s" hx-swap="outerHTML">
    <div style="display: flex; flex-direction: column; gap: 0.5rem; width: 100%;">
        <div style="display: flex; gap: 1rem; align-items: center;">
            <div class="icon-box">
                <span class="material-symbols-outlined">activity_zone</span>
            </div>
            <div class="info-details">
                <strong>Load Average</strong>
                <span>1m: {{ "%.2f"|format(load_info.load_avg[0]) }} | 5m: {{ "%.2f"|format(load_info.load_avg[1]) }} |
                    15m: {{ "%.2f"|format(load_info.load_avg[2]) }}</span>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 0.25rem;">
            <div class="info-details"
                style="background: rgba(255,255,255,0.05); padding: 0.5rem; border-radius: var(--radius-sm);">
                <strong>Tasks</strong>
                <span>{{ load_info.running }} running / {{ load_info.tasks }} total</span>
            </div>
            <div class="info-details"
                style="background: rgba(255,255,255,0.05); padding: 0.5rem; border-radius: var(--radius-sm);">
                <strong>Threads</strong>
                <span>{{ load_info.threads }} active</span>
            </div>
        </div>
    </div>
</li>

{% if wifi_info %}
<li class="info-card">
    <div class="icon-box">
        <span class="material-symbols-outlined">wifi</span>
    </div>
    <div class="info-details">
        <strong>Wi-Fi ({{ wifi_info.interface }})</strong>
        <span>
            Strength: {{ wifi_info.signal_strength }}%
        </span>
    </div>
</li>
{% endif %}

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System Stats — Offline</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        * { margin: 0; }
        body {
            background-color: #020402;
            color: #ffffff;
            font-family: "Space Grotesk", sans-serif;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            padding: 20px;
            max-width: 1400px;
            margin: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem;
            border-bottom: 1px solid rgba(19, 236, 91, 0.1);
        }
        header h3 {
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #13ec5b;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            padding: 4px 12px;
            border-radius: 4px;
        }
        .status::before {
            content: "";
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            display: inline-block;
        }
        .message {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 4rem 1rem;
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
        }
        .message span {
            font-size: 3rem;
            color: rgba(255, 255, 255, 0.15);
        }
        .message h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
        }
        .message p {
            font-size: 0.85rem;
        }
        .retry {
            margin-top: 1rem;
            padding: 0.5rem 1.5rem;
            background: rgba(19, 236, 91, 0.1);
            color: #13ec5b;
            border: 1px solid rgba(19, 236, 91, 0.3);
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
        }
        .retry:hover {
            background: rgba(19, 236, 91, 0.2);
        }
    </style>
</head>
<body>
    <header>
        <h3>server</h3>
        <div class="status">Offline</div>
    </header>
    <div class="message">
        <span>&#xe1b8;</span>
        <h2>Service Unavailable</h2>
        <p>The monitoring service is not running.</p>
        <button class="retry" onclick="window.location.reload()">Retry</button>
    </div>
</body>
</html>
